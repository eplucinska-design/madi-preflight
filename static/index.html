<!doctype html>
<html lang="pl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>MADI Preflight / DTP</title><link rel="stylesheet" href="/workspace.css"><script src="/vendor/lucide.min.js" defer></script><script src="/tools.js" defer></script><script src="/workspace.js" defer></script></head>
<body><header class="menubar"><div class="brand">MADI<span>PREFLIGHT</span></div><div class="menu-actions"><button id="open"><i data-lucide="folder-open"></i><span>Otwórz PDF</span></button><button id="export" disabled><i data-lucide="download"></i><span>Eksportuj wynik</span></button></div><span class="connection" id="connection">Silnik PDF</span><button id="theme" class="icon-button" title="Zmień motyw" aria-label="Zmień motyw"><i data-lucide="sun-moon"></i></button><input id="file" type="file" accept="application/pdf,.pdf" multiple hidden></header>
<nav class="modulebar" aria-label="Moduły"><button data-module="preflight" class="active"><i data-lucide="scan-line"></i>Preflight</button><button data-module="imposer"><i data-lucide="layout-grid"></i>Impozycja</button><button data-module="pages"><i data-lucide="files"></i>Strony</button><button data-module="inspection"><i data-lucide="pipette"></i>Inspektor</button><span class="spacer"></span><button data-panel="workflow"><i data-lucide="list-ordered"></i>Kolejka <span id="queue-count">0</span></button><button id="toggle-panel" class="icon-button panel-mobile" title="Panel właściwości" aria-label="Panel właściwości"><i data-lucide="panel-right"></i></button></nav>
<div id="documents" class="document-tabs" role="tablist" aria-label="Dokumenty"><span class="empty-tab">Brak otwartych dokumentów</span></div>
<div class="contextbar"><div class="segments"><button id="source-tab" class="active">Oryginał</button><button id="result-tab" disabled>Wynik</button></div><span id="active-name"></span><span class="meta" id="info">—</span></div>
<main class="desk"><aside class="tool-rail" aria-label="Narzędzia podglądu"><button id="select-tool" class="icon-button active" title="Inspekcja geometrii" aria-label="Inspekcja geometrii"><i data-lucide="mouse-pointer-2"></i></button><button id="hand-tool" class="icon-button" title="Przesuwanie widoku" aria-label="Przesuwanie widoku"><i data-lucide="hand"></i></button><hr><button id="zoom-in-rail" class="icon-button" title="Powiększ" aria-label="Powiększ"><i data-lucide="zoom-in"></i></button><button id="zoom-out-rail" class="icon-button" title="Pomniejsz" aria-label="Pomniejsz"><i data-lucide="zoom-out"></i></button><button id="fit-rail" class="icon-button" title="Dopasuj stronę" aria-label="Dopasuj stronę"><i data-lucide="maximize"></i></button></aside>
<aside class="pages-panel"><div class="panel-heading">Strony <span id="pages-total">0</span></div><div id="page-list" class="page-list"></div></aside>
<section class="stage" aria-label="Obszar dokumentu"><div class="ruler-x" aria-hidden="true"><span>0</span><span>25</span><span>50</span><span>75</span><span>100</span><span>125</span><span>150</span><span>175</span><span>200 mm</span></div><div id="canvas" class="canvas"><div id="empty" class="empty"><i data-lucide="file-scan"></i><h1>MADI Preflight</h1><button id="empty-open" class="primary"><i data-lucide="folder-open"></i>Otwórz dokument PDF</button></div><div id="page-wrap" class="page-wrap" hidden><img id="preview" alt="Podgląd strony PDF"><div id="selection-box" class="selection-box" hidden></div></div></div><div class="floating-view"><button id="prev" class="icon-button" title="Poprzednia strona" aria-label="Poprzednia strona" disabled><i data-lucide="chevron-left"></i></button><span id="page-count" class="page-count">0 / 0</span><button id="next" class="icon-button" title="Następna strona" aria-label="Następna strona" disabled><i data-lucide="chevron-right"></i></button><select id="zoom" aria-label="Powiększenie"><option value="fit">Dopasuj</option><option value="0.5">50%</option><option value="0.75">75%</option><option value="1">100%</option><option value="1.5">150%</option><option value="2">200%</option><option value="3">300%</option></select></div></section>
<aside id="properties" class="properties"><div class="panel-tabs" role="tablist" aria-label="Panele"><button data-panel="parameters" class="active" role="tab" aria-selected="true">Właściwości</button><button data-panel="workflow" role="tab" aria-selected="false">Kolejka</button><button data-panel="inspection" role="tab" aria-selected="false">Inspektor</button><button data-panel="presets" role="tab" aria-selected="false">Presety</button></div><div class="panel-body"><section id="panel-parameters"><div class="tool-picker"><label for="operation">Operacja</label><select id="operation"></select></div><h2 id="operation-title" class="operation-title">Format i spad</h2><form id="form"><div id="fields"></div></form></section><section id="panel-workflow" hidden><h2 class="operation-title">Aktywne operacje</h2><div class="workflow-actions"><button id="add-step"><i data-lucide="plus"></i>Dodaj bieżącą</button><button id="run-queue" class="primary" disabled><i data-lucide="play"></i>Wykonaj</button></div><ol id="queue"></ol><p id="queue-empty" class="empty-list">Brak aktywnych operacji</p></section><section id="panel-inspection" hidden><button id="inspect" class="inspect-button" disabled><i data-lucide="scan-search"></i>Analizuj stronę</button><p id="inspection-status" class="inspection-summary">Brak analizy</p><div id="object-info"></div><div id="inspection-report"></div></section><section id="panel-presets" hidden><h2 class="operation-title">Presety produkcyjne</h2><div class="preset-controls"><input id="preset-name" aria-label="Nazwa presetu" placeholder="Nazwa presetu" maxlength="60"><button id="save-preset"><i data-lucide="save"></i>Zapisz ustawienia i kolejkę</button><select id="presets" aria-label="Zapisane presety"><option value="">Wybierz preset</option></select><button id="delete-preset"><i data-lucide="trash-2"></i>Usuń wybrany preset</button></div></section></div><div class="runbar"><div class="row"><label for="input-source">Źródło operacji</label><select id="input-source"><option value="source">Oryginał</option><option value="result">Poprzedni wynik</option></select></div><div class="row"><button id="process" class="primary" form="form" type="submit" disabled><i data-lucide="play"></i>Przetwórz PDF</button><button id="quick-add" class="queue-add" title="Dodaj do kolejki" aria-label="Dodaj do kolejki"><i data-lucide="list-plus"></i></button></div><a id="download" class="download" hidden><i data-lucide="download"></i>Pobierz wynik PDF</a></div></aside></main><footer class="statusbar"><span id="status" role="status" aria-live="polite">Gotowy</span><span id="details">Brak dokumentu</span><span>PDF / Prepress</span></footer></body></html>

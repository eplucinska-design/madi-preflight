name: PDF engine checks
on: [push, pull_request]
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: pip install -r requirements.txt
      - run: for f in static/*.js; do node --check "$f"; done
      - name: Tests (failures reported as annotations)
        shell: bash
        run: |
          set +e
          python -m unittest test_smoke -v > out.txt 2>&1
          status=$?
          cat out.txt
          if [ $status -ne 0 ]; then
            grep -E "^(FAIL|ERROR):|Error:|Exception|assert|error|line [0-9]+" out.txt | tail -n 25 | sed 's/^/::error::/'
          fi
          exit $status
  container:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: docker build -t madi-preflight .
      - name: Start in public mode and check health
        run: |
          docker run -d --name madi -p 8765:8765 -e MADI_PUBLIC=1 --read-only --tmpfs /tmp --memory 1g madi-preflight
          for i in $(seq 1 30); do curl -fsS http://127.0.0.1:8765/healthz && exit 0; sleep 1; done
          docker logs madi; exit 1
